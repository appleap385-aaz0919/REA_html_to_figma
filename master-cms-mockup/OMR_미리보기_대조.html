<!doctype html><html lang="ko"><meta charset="utf-8"><title>OMR 미리보기 14유형 대조</title><style>body{margin:0;background:#f4f6f8;color:#25313c;font:14px "Malgun Gothic",sans-serif}header{position:sticky;top:0;background:white;border-bottom:1px solid #d8dfe7;padding:16px}select{padding:8px;margin:0 12px}label{margin-right:16px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}section{min-width:0}h2{font-size:16px}img{display:block;width:100%;max-width:522px;background:white}p{margin:8px 0 0;line-height:1.7}a{color:#066fd1}#popup{max-width:522px;width:100%;margin:16px 0}details{grid-column:1/-1}@media(max-width:800px){main{grid-template-columns:1fr}}</style><header><b>OMR 미리보기 · 개발계 원본과 로컬 목업</b><select id="type"><option>OBSACN</option><option>OBSAOX</option><option>OBMACN</option><option>OBMAOX</option><option>SBSANM</option><option>SBSADR</option><option>SBSAAS</option><option>SBMANM</option><option>SBMAAS</option><option>SBMALD</option><option>SBMADD</option><option>ESBA00</option><option>ESSA00</option><option>ESMA00</option></select><label><input id="answers" type="checkbox"> 정답 보기 상태</label><a id="open">목업 열기</a><p>2026-11-17 개발계 미리보기에 동일한 예시 JSON을 전달한 화면입니다. 왼쪽은 실제 서비스 응답 영역, 오른쪽은 오프라인 목업의 같은 영역입니다. 원본 서비스에 저장하거나 채점을 요청하지 않았습니다. 이미지 클릭 시 원래 크기로 엽니다.</p></header><main><section><h2>개발계 원본</h2><a id="origLink" target="_blank"><img id="orig"></a></section><section><h2>로컬 목업</h2><a id="mockLink" target="_blank"><img id="mock"></a></section><details><summary>목업 전체 팝업 보기</summary><img id="popup"></details></main><script>function show(){let code=type.value,suffix=answers.checked?'-answers':'';orig.src='verification/preview-v2/'+code+suffix+'-original.png';mock.src='verification/preview-v2/'+code+suffix+'-mock.png';origLink.href=orig.src;mockLink.href=mock.src;popup.src='verification/preview-v2/'+code+'-popup.png';document.getElementById('open').href='index.html#/lab/omr'}type.onchange=show;answers.onchange=show;show()</script></html>
