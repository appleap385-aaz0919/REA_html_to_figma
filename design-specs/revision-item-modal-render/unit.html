<div class="modal-dialog modal-xl" role="document">
<div class="modal-content">

<h5 class="modal-title mb-0">단원코드 추가 (검색)</h5>
<button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body">
<div class="card mb-3" data-filter="" id="unitPickFilter">
<div class="card-body">
<div class="d-flex flex-nowrap gap-2 mb-2">

<select class="form-select cursor-pointer filter-select" name="keywordType">
<option value="unitCode">단원 코드</option>
<option value="unitName">단원명</option>
</select>
</div>
<div class="flex-fill">
<input class="form-control" name="keyword" placeholder="단원 코드 / 단원명" type="text">
</input></div>
</div>
<div class="d-flex flex-nowrap gap-2 mb-3">
<div class="flex-fill">
<select class="form-select cursor-pointer filter-select" data-code-source="curriculum" data-default-value="22" id="unitPickCurriculumSelect" name="curriculum">
<option value="">교육과정 전체</option>
</select>
</div>
<div class="flex-fill">
<select class="form-select cursor-pointer filter-select" data-code-parent="classtype" data-code-source="classtype" name="classType">

<option value="M">중학</option>
<option value="H">고등</option>
</select>
</div>
<div class="flex-fill">

<option value="">과목군 전체</option>
</select>
</div>
<div class="flex-fill">

<option value="">과목 전체</option>
<option data-code-classtype="E" data-code-curriculum="22" data-code-subjectcategory="MA" value="T0">수학</option>

<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="C2">공통수학2</option>

<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="B2">기본수학2</option>

<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="T2">수학2</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="A0">대수</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="D1">미적분1</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="D2">미적분2</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="S0">확률과통계</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="G0">기하</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="P0">직무수학</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="I0">인공지능수학</option>
<option data-code-classtype="H" data-code-curriculum="22" data-code-subjectcategory="MA" value="U0">수학과 문화</option>
<option data-code-classtype="M" data-code-curriculum="15" data-code-subjectcategory="MA" value="T0">수학</option>
</select>
</div>
<div class="flex-fill">
<select class="form-select cursor-pointer filter-select" data-code-child="classtype" disabled="" name="grade">
<option value="">학년 전체</option>
<option data-code-parent-value="M" value="1">중학1</option>
<option data-code-parent-value="H" value="1">고등1</option>
<option data-code-parent-value="E" value="1">초등1</option>
<option data-code-parent-value="M" value="2">중학2</option>
<option data-code-parent-value="E" value="2">초등2</option>
<option data-code-parent-value="H" value="2">고등2</option>
<option data-code-parent-value="H" value="3">고등3</option>
<option data-code-parent-value="M" value="3">중학3</option>
<option data-code-parent-value="E" value="3">초등3</option>
<option data-code-parent-value="E" value="4">초등4</option>
<option data-code-parent-value="H" value="4">고등 공통</option>

<option data-code-parent-value="E" value="6">초등6</option>

<option value="2">2학기</option>

<i class="ti ti-search me-1"></i>조회
                                </button>
</div>
</div>
</div>
<div hx-get="/learning/unit/pick-modal.donga" hx-include="#unitPickFilter" hx-swap="outerHTML" hx-target="this" hx-trigger="shown.bs.modal from:#unitPickModal" id="unitPickResult">

<button class="btn" data-bs-dismiss="modal" type="button">취소</button>
<button class="btn btn-primary" type="button">단원코드 추가</button>
</div>
</div>
</div>
